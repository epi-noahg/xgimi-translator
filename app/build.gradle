plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.traducteur.xgimi'
    compileSdk 34

    defaultConfig {
        applicationId "fr.traducteur.xgimi"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Reconnaissance du texte chinois, modèle inclus dans l'app (fonctionne hors ligne, sans Google Play)
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
